services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: purchase-intent-xai-api:latest
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
      - ./mlruns:/app/mlruns
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: purchase-intent-xai-dashboard:latest
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
    depends_on:
      - api
    restart: unless-stopped
